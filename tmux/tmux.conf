# ~/.config/tmux/tmux.conf  (tmux >= 3.1 reads this XDG path)

# ── General ───────────────────────────────────────────────────────────────────
# True color + correct terminal type (Alacritty).
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,alacritty:RGB"

set -g mouse on                 # click/scroll/resize with the mouse
set -g history-limit 50000
set -s escape-time 10           # snappier ESC (helps vim/nvim)
set -g focus-events on
set -g set-clipboard on         # sync copy with the system clipboard
set -g renumber-windows on      # keep window numbers gapless
set -g base-index 1             # windows start at 1
setw -g pane-base-index 1       # panes start at 1
setw -g mode-keys vi            # vi keys in copy mode

# ── Prefix: Ctrl-a (easier to reach than Ctrl-b) ─────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix            # press twice to send a literal Ctrl-a

# Reload config: prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"

# ── Splits & windows (open in the current pane's directory) ──────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window   -c "#{pane_current_path}"
unbind '"'
unbind %

# Close things (no confirmation prompt)
bind x kill-pane        # close current pane
bind X kill-window      # close current window (all its panes)
bind Q kill-session     # close the whole session

# ── Vim-style pane navigation ────────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes (repeatable: hold prefix, tap H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick window switching
bind -r p previous-window
bind -r n next-window

# ── Copy mode (vi) — yanks into the Wayland system clipboard via wl-copy ─────
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle                 # block/column select
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Escape send -X cancel
# Mouse drag: copy on release straight to the clipboard
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"

# Scroll history with Shift+PageUp/PageDown (enters copy mode automatically).
bind -n S-PageUp copy-mode -u
bind -T copy-mode-vi S-PageUp   send -X page-up
bind -T copy-mode-vi S-PageDown send -X page-down

# ══ Tokyo Night theme ═════════════════════════════════════════════════════════
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1a1b26,fg=#c0caf5"

# Left: session name
set -g status-left-length 40
set -g status-left "#[fg=#1a1b26,bg=#7aa2f7,bold]  #S #[fg=#7aa2f7,bg=#1a1b26]"

# Right: date + time + host
set -g status-right-length 80
set -g status-right "#[fg=#414868,bg=#1a1b26]#[fg=#c0caf5,bg=#414868]  %Y-%m-%d #[fg=#7aa2f7,bg=#414868]#[fg=#1a1b26,bg=#7aa2f7,bold]  %H:%M #[fg=#1a1b26,bg=#7aa2f7] #[fg=#c0caf5,bg=#7aa2f7,bold] #h "

# Windows
set -g window-status-separator ""
set -g window-status-format "#[fg=#414868,bg=#1a1b26]  #I:#W "
set -g window-status-current-format "#[fg=#1a1b26,bg=#7aa2f7]#[fg=#1a1b26,bg=#7aa2f7,bold] #I:#W #[fg=#7aa2f7,bg=#1a1b26]"

# Panes / messages / copy-mode
set -g pane-border-style "fg=#414868"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#7aa2f7,fg=#1a1b26,bold"
set -g mode-style "bg=#283457,fg=#c0caf5"
